<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Alerta</title>
<script>
/* nest-model.github.io/alerta/ник → страница доната */
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var i = parts.indexOf('alerta');
  var nick = i >= 0 ? parts[i + 1] : parts[0];
  var base = i >= 0 ? '/' + parts.slice(0, i + 1).join('/') + '/' : '/';
  if (nick && /^@?[a-z0-9][a-z0-9_.-]{2,23}$/i.test(nick)) location.replace(base + 'd/?' + nick.replace(/^@/, '').toLowerCase());
  else location.replace(base);
})();
</script></head><body></body></html>
